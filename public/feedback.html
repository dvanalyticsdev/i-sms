<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>i-SMS | Review Management</title>
  <script src="theme-bootstrap.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    .student-name-link {
      color: var(--heading);
      text-decoration: none;
      transition: color var(--ease);
    }
    .student-name-link:hover {
      color: var(--primary);
      text-decoration: underline;
    }
    .feedback-tab-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }
    .feedback-comment-cell {
      max-width: 220px;
      white-space: normal;
      word-wrap: break-word;
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.3;
    }
    .table-pag-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      border-top: 1px solid var(--border);
      background: var(--bg-surface);
    }
    .table-pag-btn {
      padding: 5px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      background: var(--bg-card);
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }
    .table-pag-btn.is-active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .table-pag-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="layout-root">
    <aside class="sidebar">
      <div class="sidebar-brand">
        <div class="sms-logo-wrap">
          <div class="sms-text-wrap"><span class="sms-logo-text">i-SMS</span></div>
          <div class="sms-dv-badge"><span class="sms-dv-by">by</span><img src="Logos/DV-Logo.png" alt="DV Analytics" class="sms-dv-img"></div>
        </div>
      </div>
      <nav class="sidebar-nav">
        <a href="student-performance-dashboard.html" class="sidebar-link" data-tooltip="Performance Dashboard" aria-label="Performance Dashboard">
          <div class="sidebar-icon-wrap">
            <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
              <path d="M6 12v5c3 3 9 3 12 0v-5"/>
            </svg>
          </div>
          <span class="sidebar-link-text">Performance Dashboard</span>
        </a>
        <a href="student-review-dashboard.html" class="sidebar-link" data-tooltip="Review Dashboard" aria-label="Review Dashboard">
          <div class="sidebar-icon-wrap">
            <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
            </svg>
          </div>
          <span class="sidebar-link-text">Review Dashboard</span>
        </a>
        <a href="performance.html" class="sidebar-link" data-tooltip="Performance Management" aria-label="Performance Management">
          <div class="sidebar-icon-wrap">
            <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
              <circle cx="9" cy="7" r="4"></circle>
              <path d="M23 21v-2a4 4 0 0 3-3.87"></path>
              <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
            </svg>
          </div>
          <span class="sidebar-link-text">Performance Management</span>
        </a>
        <a href="feedback.html" class="sidebar-link is-active" data-tooltip="Review Management" aria-label="Review Management">
          <div class="sidebar-icon-wrap">
            <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
          </div>
          <span class="sidebar-link-text">Review Management</span>
        </a>
      </nav>
      <div class="sidebar-bottom-links">
        <button data-logout class="sidebar-link sidebar-link-bottom btn-ghost" data-tooltip="Log out" aria-label="Log out" style="border:none; cursor:pointer;">
          <div class="sidebar-icon-wrap">
            <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </div>
        </button>
      </div>
    </aside>

    <div class="main-content">
      <header class="topbar">
        <div>
          <h1 style="font-size:18px; font-weight:800; text-transform:uppercase; letter-spacing:0.5px;">REVIEW MANAGEMENT</h1>
          <p style="font-size:12px; color:var(--text-muted); margin-top:2px;" id="tabDesc">Manage class reviews, mentor feedback, evaluations, and staff directory.</p>
        </div>
        <div class="topbar-actions">
          <button class="btn-primary" id="activeAddBtn">+ Add Feedback</button>
          <button type="button" class="theme-toggle" data-theme-toggle aria-pressed="false">
            <span class="theme-toggle__stack" aria-hidden="true">
              <span class="theme-toggle__icon theme-toggle__icon--sun" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.5"></circle><path d="M12 1.8v2.4M12 19.8v2.4M4.2 4.2l1.7 1.7M18.1 18.1l1.7 1.7M1.8 12h2.4M19.8 12h2.4M4.2 19.8l1.7-1.7M18.1 5.9l1.7-1.7"></path></svg></span>
              <span class="theme-toggle__icon theme-toggle__icon--moon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M20.2 14.7A8.2 8.2 0 0 1 9.3 3.8a8.5 8.5 0 1 0 10.9 10.9Z"></path></svg></span>
            </span>
          </button>
        </div>
      </header>

      <main class="page-container">
        <div class="card" style="padding:12px 16px 0; margin-bottom:16px;">
          <div class="tablist feedback-tablist" style="margin:0;">
            <button class="tab is-active" data-feedback-tab="faculty">Faculty Feedback</button>
            <button class="tab" data-feedback-tab="mentor">Mentor Feedback</button>
            <button class="tab" data-feedback-tab="evaluation">Student Evaluation</button>
            <button class="tab" data-feedback-tab="facultyStaff">Faculty</button>
            <button class="tab" data-feedback-tab="mentorStaff">Mentor</button>
            <button class="tab" data-feedback-tab="coordinatorStaff">Student Coordinator</button>
          </div>
        </div>

        <div class="card" style="margin-top:16px;">
          <div class="toolbar" style="padding:12px 16px; border-bottom:1px solid var(--border); display:flex; gap:12px; align-items:center; justify-content:space-between; flex-wrap:wrap;">
            <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap;">
              <select id="studentFilter" class="form-control" style="width:180px;"><option value="All">All students</option></select>
              <select id="applicationFilter" class="form-control" style="width:180px;"><option value="All">All applications</option></select>
              <input type="search" id="searchInput" class="form-control" style="width:200px;" placeholder="Search reviews...">
            </div>
            <div style="font-size:12px; color:var(--text-muted);" id="rowCountInfo"></div>
          </div>
          <div class="table-responsive">
            <table class="data-table">
              <thead id="feedbackHead"></thead>
              <tbody id="feedbackBody"></tbody>
            </table>
          </div>
          <div class="table-pag-bar" id="feedbackPagBar"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- Faculty Feedback Modal -->
  <div class="modal-backdrop" id="facultyModal">
    <div class="modal-overlay" data-close="facultyModal"></div>
    <div class="modal-container">
      <div class="modal-header"><h3 class="modal-title">Add Faculty Feedback</h3><button class="modal-close" data-close="facultyModal">&times;</button></div>
      <form id="facultyForm">
        <div class="modal-body" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group"><label>Student</label><select id="facStudent" class="form-control" required></select></div>
          <div class="form-group"><label>Call Date</label><input id="facCallDate" type="date" class="form-control" required></div>
          <div class="form-group"><label>Session Date</label><input id="facDate" type="date" class="form-control" required></div>
          <div class="form-group"><label>Connection</label><select id="facStatus" class="form-control"><option>YES</option><option>NO</option></select></div>
          <div class="form-group"><label>Application</label><select id="facApp" class="form-control" required></select></div>
          <div class="form-group"><label>Session</label><input id="facSession" class="form-control" value="SESSION-1" required></div>
          <div class="form-group"><label>Call By (Student Coordinator)</label><select id="facCallBy" class="form-control" required></select></div>
          <div class="form-group" style="grid-column:1/-1;"><label>Faculty Name</label><select id="facFaculty" class="form-control" required></select></div>
          <div class="form-group"><label>Overall Feedback</label><input id="facRating" type="number" min="0" max="5" step="0.1" class="form-control" value="5"></div>
          <div class="form-group"><label>Class Material</label><input id="facMaterial" type="number" min="0" max="5" step="0.1" class="form-control" value="5"></div>
          <div class="form-group"><label>Video Uploaded</label><select id="facVideoUploaded" class="form-control"><option value="On Time">On Time</option><option value="Delay">Delay</option></select></div>
          <div class="form-group"><label>Assignment</label><input id="facTiming" type="number" min="0" max="5" step="0.1" class="form-control" value="5"></div>
          <div class="form-group"><label>Class Speed</label><input id="facSpeed" type="number" min="0" max="5" step="0.1" class="form-control" value="4"></div>
          <div class="form-group"><label>Satisfaction</label><input id="facSatisfaction" type="number" min="0" max="5" step="0.1" class="form-control" value="5"></div>
          <div class="form-group" style="grid-column:1/-1;"><label>Review Summary</label><textarea id="facComments" class="form-control" rows="2"></textarea></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn-secondary" data-close="facultyModal">Cancel</button><button class="btn-primary" type="submit">Save</button></div>
      </form>
    </div>
  </div>

  <!-- Mentor Feedback Modal -->
  <div class="modal-backdrop" id="mentorModal">
    <div class="modal-overlay" data-close="mentorModal"></div>
    <div class="modal-container">
      <div class="modal-header"><h3 class="modal-title">Add Mentor Feedback</h3><button class="modal-close" data-close="mentorModal">&times;</button></div>
      <form id="mentorForm">
        <div class="modal-body" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group"><label>Student</label><select id="menStudent" class="form-control" required></select></div>
          <div class="form-group"><label>Call Date</label><input id="menCallDate" type="date" class="form-control" required></div>
          <div class="form-group"><label>Session Date</label><input id="menDate" type="date" class="form-control" required></div>
          <div class="form-group"><label>Connection</label><select id="menStatus" class="form-control"><option>YES</option><option>NO</option></select></div>
          <div class="form-group"><label>Application</label><select id="menApp" class="form-control" required></select></div>
          <div class="form-group"><label>Session</label><input id="menSession" class="form-control" value="SESSION-1" required></div>
          <div class="form-group"><label>Call By (Student Coordinator)</label><select id="menCallBy" class="form-control" required></select></div>
          <div class="form-group" style="grid-column:1/-1;"><label>Mentor Name</label><select id="menMentor" class="form-control" required></select></div>
          <div class="form-group"><label>Mentor Rating</label><input id="menRating" type="number" min="0" max="5" step="0.1" class="form-control" value="5"></div>
          <div class="form-group"><label>Doubt Support</label><input id="menDoubt" type="number" min="0" max="5" step="0.1" class="form-control" value="5"></div>
          <div class="form-group"><label>Behaviour</label><input id="menBehaviour" type="number" min="0" max="5" step="0.1" class="form-control" value="5"></div>
          <div class="form-group"><label>Attention</label><input id="menAttention" type="number" min="0" max="5" step="0.1" class="form-control" value="5"></div>
          <div class="form-group"><label>Satisfaction</label><input id="menSatisfaction" type="number" min="0" max="5" step="0.1" class="form-control" value="5"></div>
          <div class="form-group" style="grid-column:1/-1;"><label>Comments</label><textarea id="menComments" class="form-control" rows="2"></textarea></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn-secondary" data-close="mentorModal">Cancel</button><button class="btn-primary" type="submit" style="background:#2563eb; border-color:#2563eb;">Save</button></div>
      </form>
    </div>
  </div>

  <!-- Student Evaluation Modal -->
  <div class="modal-backdrop" id="evalModal">
    <div class="modal-overlay" data-close="evalModal"></div>
    <div class="modal-container">
      <div class="modal-header"><h3 class="modal-title">Add Student Evaluation</h3><button class="modal-close" data-close="evalModal">&times;</button></div>
      <form id="evalForm">
        <div class="modal-body" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group"><label>Student</label><select id="evalStudent" class="form-control" required></select></div>
          <div class="form-group"><label>Call Date</label><input id="evalCallDate" type="date" class="form-control" required></div>
          <div class="form-group"><label>Session Date</label><input id="evalDate" type="date" class="form-control" required></div>
          <div class="form-group"><label>Connection</label><select id="evalStatus" class="form-control"><option>YES</option><option>NO</option></select></div>
          <div class="form-group"><label>Application</label><select id="evalApp" class="form-control" required></select></div>
          <div class="form-group"><label>Session</label><input id="evalSession" class="form-control" value="SESSION-1" required></div>
          <div class="form-group"><label>Call By (Student Coordinator)</label><select id="evalCallBy" class="form-control" required></select></div>
          <div class="form-group" style="grid-column:1/-1;"><label>Mentor Name</label><select id="evalMentor" class="form-control" required></select></div>
          <div class="form-group"><label>Assignment Status</label><select id="evalAssignment" class="form-control"><option>COMPLETED</option><option>IN PROGRESS</option><option>NOT STARTED</option></select></div>
          <div class="form-group"><label>Knowledge</label><select id="evalKnowledge" class="form-control"><option>BEST</option><option selected>GOOD</option><option>AVERAGE</option><option>LOW</option></select></div>
          <div class="form-group" style="grid-column:1/-1;"><label>Overall Feedback</label><textarea id="evalComments" class="form-control" rows="3" required></textarea></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn-secondary" data-close="evalModal">Cancel</button><button class="btn-primary" type="submit" style="background:#059669; border-color:#059669;">Save</button></div>
      </form>
    </div>
  </div>

  <!-- Staff Modal -->
  <div class="modal-backdrop" id="staffModal">
    <div class="modal-overlay" data-close="staffModal"></div>
    <div class="modal-container">
      <div class="modal-header"><h3 class="modal-title" id="staffModalTitle">Add Staff Member</h3><button class="modal-close" data-close="staffModal">&times;</button></div>
      <form id="staffForm">
        <div class="modal-body" style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
          <div class="form-group"><label>Type</label><select id="staffType" class="form-control" required><option value="Faculty">Faculty</option><option value="Mentor">Mentor</option><option value="Student Coordinator">Student Coordinator</option></select></div>
          <div class="form-group"><label>Name</label><input id="staffName" class="form-control" required placeholder="Enter name"></div>
          <div class="form-group"><label>Email</label><input id="staffEmail" type="email" class="form-control" placeholder="name@example.com"></div>
          <div class="form-group"><label>Phone</label><input id="staffPhone" class="form-control" placeholder="+91 XXXXX XXXXX"></div>
          <div class="form-group" style="grid-column:1/-1;"><label>Status</label><select id="staffStatus" class="form-control"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
        </div>
        <div class="modal-foot"><button type="button" class="btn-secondary" data-close="staffModal">Cancel</button><button class="btn-primary" type="submit">Save Staff</button></div>
      </form>
    </div>
  </div>

  <script type="module">
    import { apiFetch } from './app.js';

    let activeTab = "faculty";
    let faculty = [];
    let mentor = [];
    let evals = [];
    let staff = [];
    let students = [];
    let modules = [];
    let currentPage = 1;
    const pageSize = 10;

    const tabConfig = {
      faculty: {
        title: "Faculty Feedback",
        description: "Student rates class delivery, pace, material, and satisfaction.",
        modal: "facultyModal",
        headers: ["#", "Call Date", "Session Date", "Student ID", "Student Name", "Batch", "Course", "Application", "Session", "Call By", "Faculty", "Class Material", "Video Uploaded", "Assignment", "Class Speed", "Overall Feedback", "Review Summary"]
      },
      mentor: {
        title: "Mentor Feedback",
        description: "Student rates mentoring, doubt support, behaviour, and attention.",
        modal: "mentorModal",
        headers: ["#", "Call Date", "Session Date", "Student ID", "Student Name", "Batch", "Course", "Application", "Session", "Call By", "Mentor", "Doubt Support", "Behaviour", "Attention", "Overall Feedback", "Comments"]
      },
      evaluation: {
        title: "Student Evaluation",
        description: "Mentor records assignment status, knowledge level, and call note.",
        modal: "evalModal",
        headers: ["#", "Call Date", "Session Date", "Student ID", "Student Name", "Batch", "Course", "Application", "Session", "Call By", "Mentor", "Assignment Status", "Knowledge", "Overall Feedback"]
      },
      facultyStaff: {
        title: "Faculty",
        description: "Maintain faculty members list used inside feedback forms.",
        modal: "staffModal",
        headers: ["Name", "Type", "Email", "Phone", "Status", ""]
      },
      mentorStaff: {
        title: "Mentor",
        description: "Maintain mentor members list used inside feedback forms.",
        modal: "staffModal",
        headers: ["Name", "Type", "Email", "Phone", "Status", ""]
      },
      coordinatorStaff: {
        title: "Student Coordinator",
        description: "Maintain student coordinators directory.",
        modal: "staffModal",
        headers: ["Name", "Type", "Email", "Phone", "Status", ""]
      }
    };

    const el = id => document.getElementById(id);
    const today = () => new Date().toISOString().split("T")[0];
    const closeModal = id => el(id).classList.remove("is-open");
    const openModal = id => el(id).classList.add("is-open");
    const up = value => String(value || "").toUpperCase();

    const matchesFilters = item => {
      const student = el("studentFilter").value;
      const application = el("applicationFilter").value;
      const searchInput = el("searchInput");
      const query = (searchInput ? searchInput.value.trim().toLowerCase() : "");

      const matchesStudent = (student === "All" || item.studentId === student || item.batch === student);
      const matchesApp = (application === "All" || up(item.application) === up(application));
      const matchesQuery = !query ||
        String(item.studentName || "").toLowerCase().includes(query) ||
        String(item.studentId || "").toLowerCase().includes(query) ||
        String(item.batch || "").toLowerCase().includes(query) ||
        String(item.facultyName || item.faculty || item.calledBy || "").toLowerCase().includes(query) ||
        String(item.comments || item.reviewSummary || "").toLowerCase().includes(query);

      return matchesStudent && matchesApp && matchesQuery;
    };

    function renderScorePill(val) {
      const num = Number(val) || 0;
      let bg = '#16a34a';
      if (num < 3.5) bg = '#dc2626';
      else if (num < 4.5) bg = '#f59e0b';
      return `<span style="display:inline-block; padding:2px 8px; border-radius:12px; font-size:11.5px; font-weight:700; background:${bg}18; color:${bg}; border:1px solid ${bg}40;">${num.toFixed(1)}</span>`;
    }

    function renderMetrics() {
      const container = el("feedbackMetrics");
      if (!container) return;
      const all = [...faculty, ...mentor, ...evals].filter(matchesFilters);
      const connected = all.filter(i => up(i.connectionStatus) === "YES").length;
      const avgRating = arr => arr.length ? (arr.reduce((a, b) => a + Number(b.overallFeedback || b.facultyRating || b.mentorRating || 0), 0) / arr.length).toFixed(1) : "0.0";
      if (["facultyStaff", "mentorStaff", "coordinatorStaff"].includes(activeTab)) {
        el("feedbackMetrics").innerHTML = [
          ["Faculty", staff.filter(member => member.type === "Faculty").length, "Active faculty members"],
          ["Mentors", staff.filter(member => member.type === "Mentor").length, "Active mentor members"],
          ["Coordinators", staff.filter(member => member.type === "Student Coordinator").length, "Active student coordinators"],
          ["Total Directory", staff.length, "Combined staff count"]
        ].map(m => `<div class="metric-card"><p class="metric-label">${m[0]}</p><p class="metric-value">${m[1]}</p><p class="metric-note">${m[2]}</p></div>`).join("");
        return;
      }

      el("feedbackMetrics").innerHTML = [
        ["Total Reviews", all.length, "Across the selected filters"],
        ["Reachability", `${all.length ? Math.round((connected / all.length) * 100) : 0}%`, "Connected calls"],
        ["Average Rating", `${avgRating(faculty.filter(matchesFilters))} / 5`, "Average class experience"],
        ["Mentor Rating", `${avgRating(mentor.filter(matchesFilters))} / 5`, "Average support experience"]
      ].map(m => `<div class="metric-card"><p class="metric-label">${m[0]}</p><p class="metric-value">${m[1]}</p><p class="metric-note">${m[2]}</p></div>`).join("");
    }

    function activeRows() {
      if (activeTab === "faculty") return faculty.filter(matchesFilters);
      if (activeTab === "mentor") return mentor.filter(matchesFilters);
      if (activeTab === "evaluation") return evals.filter(matchesFilters);
      if (activeTab === "facultyStaff") return staff.filter(member => member.type === "Faculty");
      if (activeTab === "mentorStaff") return staff.filter(member => member.type === "Mentor");
      if (activeTab === "coordinatorStaff") return staff.filter(member => member.type === "Student Coordinator");
      return [];
    }

    function renderVideoBadge(val) {
      const str = String(val || "").toLowerCase();
      const isDelay = str.includes("delay") || (typeof val === 'number' && val < 4.0);
      if (isDelay) {
        return `<span class="badge badge-risk" style="display:inline-block; padding:2px 8px; font-weight:700; font-size:11px; border-radius:10px; background:#fee2e2; color:#dc2626; border:1px solid #fca5a5;">Delay</span>`;
      }
      return `<span class="badge badge-completed" style="display:inline-block; padding:2px 8px; font-weight:700; font-size:11px; border-radius:10px; background:#dcfce7; color:#16a34a; border:1px solid #86efac;">On Time</span>`;
    }

    function renderFacultyRow(item, idx) {
      const studentLink = item.studentId ? `student-dashboard.html?id=${encodeURIComponent(item.studentId)}` : '#';
      const rowNum = (currentPage - 1) * pageSize + (idx + 1);
      const overall = Number(item.overallFeedback || item.facultyRating || item.overallSatisfaction || 5.0);
      const mat = Number(item.classMaterial || item.material || 5.0);
      const vid = item.videoUploaded || item.video;
      const asgn = Number(item.assignment !== undefined ? item.assignment : (item.assignmentRating !== undefined ? item.assignmentRating : 5.0));
      const spd = Number(item.classSpeed || 4.5);
      const summary = item.reviewSummary || item.comments || "--";

      return `
        <tr>
          <td style="color:var(--text-muted); font-size:12px; font-weight:600; text-align:center;">${rowNum}</td>
          <td style="font-size:12px; white-space:nowrap;">${item.callDate || "--"}</td>
          <td style="font-size:12px; white-space:nowrap;">${item.sessionDate || item.date || "--"}</td>
          <td><code>${item.studentId}</code></td>
          <td><a href="${studentLink}" class="student-name-link" title="Click to view student scorecard"><strong>${item.studentName}</strong></a></td>
          <td><span class="badge badge-neutral">${item.batch}</span></td>
          <td style="font-size:12px; color:var(--text-muted);">${item.course || "Data Analytics with AI"}</td>
          <td><span class="badge badge-neutral">${item.application}</span></td>
          <td><span class="badge badge-neutral">${item.session || "SESSION-1"}</span></td>
          <td><strong style="color:var(--primary); font-size:12px;">${item.calledBy || item.callBy || "--"}</strong></td>
          <td><strong>${item.faculty || item.facultyName || "--"}</strong></td>
          <td style="font-weight:700; text-align:center;">${mat.toFixed(1)}</td>
          <td style="text-align:center;">${renderVideoBadge(vid)}</td>
          <td style="font-weight:700; text-align:center;">${asgn.toFixed(1)}</td>
          <td style="font-weight:700; text-align:center;">${spd.toFixed(1)}</td>
          <td>${renderScorePill(overall)}</td>
          <td class="feedback-comment-cell">${summary}</td>
        </tr>
      `;
    }

    function renderMentorRow(item, idx) {
      const studentLink = item.studentId ? `student-dashboard.html?id=${encodeURIComponent(item.studentId)}` : '#';
      const rowNum = (currentPage - 1) * pageSize + (idx + 1);
      const overall = Number(item.overallSatisfaction || item.mentorRating || 5.0);
      return `
        <tr>
          <td style="color:var(--text-muted); font-size:12px; font-weight:600; text-align:center;">${rowNum}</td>
          <td style="font-size:12px; white-space:nowrap;">${item.callDate || "--"}</td>
          <td style="font-size:12px; white-space:nowrap;">${item.sessionDate || item.date || "--"}</td>
          <td><code>${item.studentId}</code></td>
          <td><a href="${studentLink}" class="student-name-link" title="Click to view student scorecard"><strong>${item.studentName}</strong></a></td>
          <td><span class="badge badge-neutral">${item.batch}</span></td>
          <td style="font-size:12px; color:var(--text-muted);">${item.course}</td>
          <td><span class="badge badge-neutral">${item.application}</span></td>
          <td><span class="badge badge-neutral">${item.session || "SESSION-1"}</span></td>
          <td><strong style="color:var(--primary); font-size:12px;">${item.calledBy || item.callBy || "--"}</strong></td>
          <td><strong>${item.mentorName || "Not assigned"}</strong></td>
          <td style="font-weight:700; text-align:center;">${Number(item.doubtClearing || 5.0).toFixed(1)}</td>
          <td style="font-weight:700; text-align:center;">${Number(item.behaviour || 5.0).toFixed(1)}</td>
          <td style="font-weight:700; text-align:center;">${Number(item.attention || 5.0).toFixed(1)}</td>
          <td>${renderScorePill(overall)}</td>
          <td class="feedback-comment-cell">${item.comments || "--"}</td>
        </tr>
      `;
    }

    function renderEvaluationRow(item, idx) {
      const k = up(item.applicationKnowledge);
      const isGood = k === "BEST" || k === "GOOD";
      const knowledgeClass = isGood ? "badge-completed" : "badge-risk";
      const assignStatus = up(item.assignmentStatus);
      const isAssignDone = assignStatus === "COMPLETED";
      const studentLink = item.studentId ? `student-dashboard.html?id=${encodeURIComponent(item.studentId)}` : '#';
      const rowNum = (currentPage - 1) * pageSize + (idx + 1);
      return `
        <tr>
          <td style="color:var(--text-muted); font-size:12px; font-weight:600; text-align:center;">${rowNum}</td>
          <td style="font-size:12px; white-space:nowrap;">${item.callDate || "--"}</td>
          <td style="font-size:12px; white-space:nowrap;">${item.sessionDate || item.date || "--"}</td>
          <td><code>${item.studentId}</code></td>
          <td><a href="${studentLink}" class="student-name-link" title="Click to view student scorecard"><strong>${item.studentName}</strong></a></td>
          <td><span class="badge badge-neutral">${item.batch}</span></td>
          <td style="font-size:12px; color:var(--text-muted);">${item.course}</td>
          <td><span class="badge badge-neutral">${item.application}</span></td>
          <td><span class="badge badge-neutral">${item.session || "SESSION-1"}</span></td>
          <td><strong style="color:var(--primary); font-size:12px;">${item.calledBy || item.callBy || "--"}</strong></td>
          <td><strong>${item.mentorName || "Not assigned"}</strong></td>
          <td><span class="badge ${isAssignDone ? "badge-completed" : "badge-risk"}">${assignStatus}</span></td>
          <td><span class="badge ${knowledgeClass}">${k}</span></td>
          <td class="feedback-comment-cell">${item.overallFeedback || "--"}</td>
        </tr>
      `;
    }

    function renderStaffRow(item) {
      return `
        <tr>
          <td><strong>${item.name}</strong></td>
          <td><span class="badge ${item.type === "Faculty" ? "badge-completed" : "badge-neutral"}">${item.type}</span></td>
          <td>${item.email || "--"}</td>
          <td>${item.phone || "--"}</td>
          <td><span class="badge ${item.status === "Active" ? "badge-completed" : "badge-risk"}">${item.status}</span></td>
          <td style="text-align:right;">
            <button class="btn-ghost" style="color:var(--danger); padding:4px 8px; font-size:12px;" onclick="removeStaff('${item.id}', '${item.name}')">Remove</button>
          </td>
        </tr>
      `;
    }

    function renderActiveTab() {
      const config = tabConfig[activeTab];
      el("tabDesc").textContent = config.description;
      el("activeAddBtn").textContent = ["facultyStaff", "mentorStaff", "coordinatorStaff"].includes(activeTab) ? `+ Add ${config.title}` : `+ Add ${config.title}`;
      document.querySelectorAll("[data-feedback-tab]").forEach(btn => btn.classList.toggle("is-active", btn.dataset.feedbackTab === activeTab));

      el("feedbackHead").innerHTML = `<tr>${config.headers.map(h => `<th>${h}</th>`).join("")}</tr>`;
      renderMetrics();

      const rows = activeRows();
      if (!rows.length) {
        el("feedbackBody").innerHTML = `<tr><td colspan="${config.headers.length}" style="text-align:center; padding:2rem; color:var(--text-muted);">No records found.</td></tr>`;
        el("feedbackPagBar").innerHTML = "";
        el("rowCountInfo").textContent = "Showing 0 records";
        return;
      }

      const totalPages = Math.ceil(rows.length / pageSize);
      if (currentPage > totalPages) currentPage = totalPages;
      if (currentPage < 1) currentPage = 1;

      const start = (currentPage - 1) * pageSize;
      const end = Math.min(start + pageSize, rows.length);
      const pageSlice = rows.slice(start, end);

      el("rowCountInfo").textContent = `Showing ${start + 1}–${end} of ${rows.length} records (Page ${currentPage} of ${totalPages})`;

      if (activeTab === "faculty") {
        el("feedbackBody").innerHTML = pageSlice.map((item, idx) => renderFacultyRow(item, idx)).join("");
      } else if (activeTab === "mentor") {
        el("feedbackBody").innerHTML = pageSlice.map((item, idx) => renderMentorRow(item, idx)).join("");
      } else if (activeTab === "evaluation") {
        el("feedbackBody").innerHTML = pageSlice.map((item, idx) => renderEvaluationRow(item, idx)).join("");
      } else {
        el("feedbackBody").innerHTML = pageSlice.map(item => renderStaffRow(item)).join("");
      }

      renderPaginationControls(rows.length, totalPages);
    }

    function renderPaginationControls(totalCount, totalPages) {
      const bar = el("feedbackPagBar");
      if (!bar) return;

      let btns = `<button class="table-pag-btn" ${currentPage === 1 ? 'disabled' : ''} id="pagPrevBtn">« Prev</button>`;
      for (let p = 1; p <= totalPages; p++) {
        if (p === 1 || p === totalPages || (p >= currentPage - 1 && p <= currentPage + 1)) {
          btns += `<button class="table-pag-btn ${p === currentPage ? 'is-active' : ''}" data-page="${p}">${p}</button>`;
        } else if (p === currentPage - 2 || p === currentPage + 2) {
          btns += `<span style="padding:0 4px; font-size:12px; color:var(--text-muted);">...</span>`;
        }
      }
      btns += `<button class="table-pag-btn" ${currentPage === totalPages ? 'disabled' : ''} id="pagNextBtn">Next »</button>`;

      bar.innerHTML = `
        <div style="font-size:12px; color:var(--text-muted);">Page <strong>${currentPage}</strong> of <strong>${totalPages}</strong></div>
        <div style="display:flex; gap:4px;">${btns}</div>
      `;

      if (el("pagPrevBtn")) el("pagPrevBtn").addEventListener("click", () => { currentPage--; renderActiveTab(); });
      if (el("pagNextBtn")) el("pagNextBtn").addEventListener("click", () => { currentPage++; renderActiveTab(); });
      bar.querySelectorAll("[data-page]").forEach(b => {
        b.addEventListener("click", () => {
          currentPage = parseInt(b.dataset.page, 10);
          renderActiveTab();
        });
      });
    }

    function populateStaffDropdowns() {
      const faculties = staff.filter(m => m.type === "Faculty").map(m => `<option value="${m.name}">${m.name}</option>`).join("");
      const mentors = staff.filter(m => m.type === "Mentor").map(m => `<option value="${m.name}">${m.name}</option>`).join("");
      const coordinators = staff.filter(m => m.type === "Student Coordinator").map(m => `<option value="${m.name}">${m.name}</option>`).join("");

      if (el("facFaculty")) el("facFaculty").innerHTML = faculties || `<option value="">No faculty added</option>`;
      if (el("menMentor")) el("menMentor").innerHTML = mentors || `<option value="">No mentors added</option>`;
      if (el("evalMentor")) el("evalMentor").innerHTML = mentors || `<option value="">No mentors added</option>`;

      if (el("facCallBy")) el("facCallBy").innerHTML = coordinators || `<option value="">No coordinators added</option>`;
      if (el("menCallBy")) el("menCallBy").innerHTML = coordinators || `<option value="">No coordinators added</option>`;
      if (el("evalCallBy")) el("evalCallBy").innerHTML = coordinators || `<option value="">No coordinators added</option>`;
    }

    async function loadStaff() {
      staff = await apiFetch('/api/staff');
      populateStaffDropdowns();
      if (["facultyStaff", "mentorStaff", "coordinatorStaff"].includes(activeTab)) renderActiveTab();
    }

    async function removeStaff(id, name) {
      if (!confirm(`Remove ${name} from directory? Existing feedback records will keep the saved name.`)) return;
      await apiFetch(`/api/staff/${encodeURIComponent(id)}`, { method: "DELETE" });
      await loadStaff();
    }
    window.removeStaff = removeStaff;

    async function loadFeedback() {
      faculty = await apiFetch('/api/feedback?type=Faculty');
      mentor = await apiFetch('/api/feedback?type=Mentor');
      evals = await apiFetch('/api/feedback?type=Evaluation');
      renderActiveTab();
    }

    async function init() {
      students = await apiFetch('/api/students');
      modules = await apiFetch('/api/modules');
      staff = await apiFetch('/api/staff');
      const studentOptions = students.map(s => `<option value="${s.id}">${s.name} (${s.id})</option>`).join("");
      const moduleOptions = modules.map(m => `<option value="${m}">${m}</option>`).join("");
      ["facStudent", "menStudent", "evalStudent"].forEach(id => el(id).innerHTML = studentOptions);
      ["facApp", "menApp", "evalApp"].forEach(id => el(id).innerHTML = moduleOptions);
      populateStaffDropdowns();
      el("studentFilter").innerHTML = `<option value="All">All students</option>${studentOptions}`;
      el("applicationFilter").innerHTML = `<option value="All">All applications</option>${moduleOptions}`;
      ["facCallDate", "facDate", "menCallDate", "menDate", "evalCallDate", "evalDate"].forEach(id => {
        if (el(id)) el(id).value = today();
      });
      document.querySelectorAll("[data-close]").forEach(btn => btn.addEventListener("click", () => closeModal(btn.dataset.close)));
      document.querySelectorAll("[data-feedback-tab]").forEach(btn => {
        btn.addEventListener("click", () => {
          activeTab = btn.dataset.feedbackTab;
          currentPage = 1;
          renderActiveTab();
        });
      });
      el("activeAddBtn").addEventListener("click", () => {
        if (activeTab === "facultyStaff") {
          el("staffType").value = "Faculty";
          el("staffModalTitle").textContent = "Add Faculty";
        } else if (activeTab === "mentorStaff") {
          el("staffType").value = "Mentor";
          el("staffModalTitle").textContent = "Add Mentor";
        } else if (activeTab === "coordinatorStaff") {
          el("staffType").value = "Student Coordinator";
          el("staffModalTitle").textContent = "Add Student Coordinator";
        } else {
          el("staffModalTitle").textContent = "Add Staff Member";
        }
        openModal(tabConfig[activeTab].modal);
      });
      if (el("searchInput")) el("searchInput").addEventListener("input", () => {
        currentPage = 1;
        renderActiveTab();
      });
      el("studentFilter").addEventListener("change", () => {
        currentPage = 1;
        renderActiveTab();
      });
      el("applicationFilter").addEventListener("change", () => {
        currentPage = 1;
        renderActiveTab();
      });
      await loadFeedback();
    }

    el("facultyForm").addEventListener("submit", async e => {
      e.preventDefault();
      await apiFetch('/api/feedback/faculty', { method: "POST", body: JSON.stringify({
        studentId: el("facStudent").value,
        callDate: el("facCallDate").value,
        sessionDate: el("facDate").value,
        connectionStatus: el("facStatus").value,
        application: el("facApp").value,
        session: el("facSession").value,
        calledBy: el("facCallBy").value,
        facultyName: el("facFaculty").value,
        facultyRating: el("facRating").value,
        material: el("facMaterial").value,
        videoUploaded: el("facVideoUploaded").value,
        assignmentRating: el("facTiming").value,
        classSpeed: el("facSpeed").value,
        overallSatisfaction: el("facSatisfaction").value,
        comments: el("facComments").value
      }) });
      closeModal("facultyModal");
      await loadFeedback();
    });

    el("mentorForm").addEventListener("submit", async e => {
      e.preventDefault();
      await apiFetch('/api/feedback/mentor', { method: "POST", body: JSON.stringify({
        studentId: el("menStudent").value,
        callDate: el("menCallDate").value,
        sessionDate: el("menDate").value,
        connectionStatus: el("menStatus").value,
        application: el("menApp").value,
        session: el("menSession").value,
        calledBy: el("menCallBy").value,
        mentorName: el("menMentor").value,
        mentorRating: el("menRating").value,
        doubtClearing: el("menDoubt").value,
        behaviour: el("menBehaviour").value,
        attention: el("menAttention").value,
        overallSatisfaction: el("menSatisfaction").value,
        comments: el("menComments").value
      }) });
      closeModal("mentorModal");
      await loadFeedback();
    });

    el("evalForm").addEventListener("submit", async e => {
      e.preventDefault();
      await apiFetch('/api/feedback/mentor-evaluation', { method: "POST", body: JSON.stringify({
        studentId: el("evalStudent").value,
        callDate: el("evalCallDate").value,
        sessionDate: el("evalDate").value,
        connectionStatus: el("evalStatus").value,
        application: el("evalApp").value,
        session: el("evalSession").value,
        calledBy: el("evalCallBy").value,
        mentorName: el("evalMentor").value,
        assignmentStatus: el("evalAssignment").value,
        applicationKnowledge: el("evalKnowledge").value,
        overallFeedback: el("evalComments").value
      }) });
      closeModal("evalModal");
      await loadFeedback();
    });

    el("staffForm").addEventListener("submit", async e => {
      e.preventDefault();
      await apiFetch('/api/staff', { method: "POST", body: JSON.stringify({
        type: el("staffType").value,
        name: el("staffName").value,
        email: el("staffEmail").value,
        phone: el("staffPhone").value,
        status: el("staffStatus").value
      }) });
      closeModal("staffModal");
      await loadStaff();
    });

    if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
    else init();
  </script>
</body>
</html>
